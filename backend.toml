#:schema https://jorge-menjivar.github.io/super-tts/backend.schema.json
# Kokoro-82M for Super TTS.
#
# Every file below is fetched by the daemon before the first `POST /v1/load`:
# the backend runs with `PrivateNetwork=yes` and a read-only backend directory,
# so it can neither download nor write a weight itself.

[backend]
    id = "app.super-tts.kokoro"
    source = "github.com/jorge-menjivar/super-tts-kokoro"
    name = "Kokoro"
    version = "0.1.0"
    kind = "subprocess"
    entrypoint = "super-tts-backend-kokoro"
    contract = "v1"
    license = "GPL-3.0-only"
    description = "Kokoro-82M local text-to-speech, 24 kHz, 41 preset voices."

[network]
    # Required to be empty for subprocess backends; the transport has no network.
    allowed_hosts = []

[[models]]
    name = "kokoro-82m"
    multilingual = true
    primary_language = "en"
    # Mandarin is phonemized by src/zh.rs rather than espeak-ng, which writes
    # its tones as digits (`ni2 hao3`) that have no token in Kokoro's
    # vocabulary. Kokoro was trained on misaki's tone arrows (tokens 169-173),
    # and src/zh.rs reproduces misaki exactly — asserted against 449 of its own
    # answers in data/zh-golden.tsv.
    #
    # Mandarin and Japanese are phonemized by src/zh.rs and src/ja.rs rather
    # than espeak-ng, whose output for them falls outside Kokoro's token
    # vocabulary. Both reproduce misaki, the g2p Kokoro was trained with, and
    # both are asserted against misaki's own answers in data/*-golden.tsv.
    supported_languages = ["en", "es", "fr", "it", "pt", "hi", "zh", "ja"]
    # 82M parameters on the CPU, in real time. No GPU path is built, so
    # claiming "gpu" would offer the user a device this backend cannot honor.
    supported_devices = ["cpu"]
    estimated_vram_bytes = 0
    # The model's own limit is 510 phoneme tokens. English averages well under
    # one token per character, so 400 characters stays inside it with room for
    # a language that phonemizes less densely.
    max_input_chars = 400
    output_sample_rate = 24000
    default_voice = "af_heart"
    voice_kinds = ["preset"]
    files = [
